<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cafe-compiler</title>
  <link rel="stylesheet" href="web/style.css">
  <script type="module" src="web/app.js"></script>
</head>
<body>
  <header>
    <h1>cafe-compiler</h1>
    <select id="example">
      <option value="">サンプル</option>
    </select>
    <label><input type="checkbox" id="listing"> ソース行コメント</label>
    <a href="https://github.com/Iranjin/cafe-compiler#言語仕様" target="_blank" rel="noopener">言語仕様</a>
  </header>

  <main>
    <section>
      <div class="head">
        <h2>Cafe Script</h2>
        <button type="button" id="copy-source">コピー</button>
      </div>
      <div class="editor">
        <pre class="gutter" aria-hidden="true"></pre>
        <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <ul class="diagnostics" id="source-diag"></ul>
    </section>

    <section>
      <div class="head">
        <h2>Cafe Code</h2>
        <button type="button" id="copy-code">コピー</button>
      </div>
      <div class="editor">
        <pre class="gutter" aria-hidden="true"></pre>
        <textarea id="code" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <ul class="diagnostics" id="code-diag"></ul>
    </section>
  </main>
</body>
</html>
